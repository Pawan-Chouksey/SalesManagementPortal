<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Customers</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>

            <h1>Customers</h1>

            <p class="text-muted">Customer relationship management </p>

        </div>

        <div>

            <a href="/" class="btn btn-secondary">Home</a>

            <a href="/customers/create" class="btn btn-primary">Add Customer</a>

        </div>

    </div>

    <div class="card shadow-sm">

        <div class="card-body">

            <table class="table table-hover align-middle">

                <thead class="table-dark">

                    <tr>
                        <th>ID</th>
                        <th>Company</th>
                        <th>Website</th>
                        <th>Actions</th>
                    </tr>

                </thead>

                <tbody>

                    {% for customer in customers %}

                    <tr>

                        <td>{{ customer.id }}</td>

                        <td>
                            <strong>{{ customer.company_name }}</strong>
                        </td>

                        <td>
                            {{ customer.website or "-" }}
                        </td>

                        <td>

                            <a href="/customers/{{ customer.id }}" class="btn btn-sm btn-info" >View</a>

                            <a href="/customers/{{ customer.id }}/edit" class="btn btn-sm btn-warning" >Edit</a>

                            <form action="/customers/{{ customer.id }}/delete" method="post" style="display:inline;" >

                                <button type="submit" class="btn btn-sm btn-danger" > Delete </button>

                            </form>

                        </td>

                    </tr>

                    {% endfor %}

                </tbody>

            </table>

        </div>

    </div>

</div>

</body>
</html>
