{% extends 'base.html' %}

{% block title %}Create Customer{% endblock %}

{% block content %}
<div class="mb-4 d-flex justify-content-between align-items-center">
    <div>
        <h2 class="fw-bold text-theme-dark"><i class="bi bi-building me-2 text-primary"></i>Create Customer</h2>
        <p class="text-muted mb-0">Add a new customer account to your pipeline.</p>
    </div>
    <a href="/customers" class="btn btn-secondary px-4"><i class="bi bi-arrow-left me-2"></i>Back</a>
</div>

<div class="glass-card p-4 p-md-5 form-container">
    <form method="POST" action="/customers/create">
        <div class="mb-4">
            <label class="form-label fw-bold small text-muted">Company Name</label>
            <div class="input-icon-wrapper">
                <i class="bi bi-building"></i>
                <input type="text" name="company_name" class="form-control form-control-icon py-2" placeholder="e.g. Acme Corp" required>
            </div>
        </div>

        <div class="mb-4">
            <label class="form-label fw-bold small text-muted">Address</label>
            <div class="input-icon-wrapper">
                <i class="bi bi-geo-alt input-icon-absolute"></i>
                <textarea name="address" rows="3" class="form-control form-control-icon py-2" placeholder="Full address"></textarea>
            </div>
        </div>

        <div class="mb-5">
            <label class="form-label fw-bold small text-muted">Website</label>
            <div class="input-icon-wrapper">
                <i class="bi bi-globe"></i>
                <input type="url" name="website" class="form-control form-control-icon py-2" placeholder="https://www.example.com">
            </div>
        </div>

        <div class="d-flex justify-content-end">
            <button type="submit" class="btn btn-primary px-5 py-2 fw-bold">
                Create Customer <i class="bi bi-check2 ms-2"></i>
            </button>
        </div>
    </form>
</div>
{% endblock %}
