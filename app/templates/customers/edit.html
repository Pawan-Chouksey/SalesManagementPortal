{% extends 'base.html' %}

{% block title %}Edit Customer{% endblock %}

{% block content %}
<div class="mb-4 d-flex justify-content-between align-items-center">
    <div>
        <h2 class="fw-bold text-theme-dark"><i class="bi bi-pencil-square me-2 text-primary"></i>Edit Customer</h2>
        <p class="text-muted mb-0">Update customer information.</p>
    </div>
    <a href="/customers/{{ customer.id }}" class="btn btn-secondary px-4"><i class="bi bi-arrow-left me-2"></i>Back</a>
</div>

<div class="glass-card p-4 p-md-5 form-container">
    <form method="POST">
        <div class="mb-4">
            <label class="form-label fw-bold small text-muted">Company Name</label>
            <div class="input-icon-wrapper">
                <i class="bi bi-building"></i>
                <input type="text" name="company_name" value="{{ customer.company_name }}" class="form-control form-control-icon py-2" required>
            </div>
        </div>

        <div class="mb-4">
            <label class="form-label fw-bold small text-muted">Address</label>
            <div class="input-icon-wrapper">
                <i class="bi bi-geo-alt input-icon-absolute"></i>
                <textarea name="address" class="form-control form-control-icon py-2" rows="3">{{ customer.address }}</textarea>
            </div>
        </div>

        <div class="mb-5">
            <label class="form-label fw-bold small text-muted">Website</label>
            <div class="input-icon-wrapper">
                <i class="bi bi-globe"></i>
                <input type="url" name="website" value="{{ customer.website }}" class="form-control form-control-icon py-2">
            </div>
        </div>

        <div class="d-flex justify-content-end">
            <button type="submit" class="btn btn-warning px-5 py-2 fw-bold text-dark">
                Update Customer <i class="bi bi-arrow-repeat ms-2"></i>
            </button>
        </div>
    </form>
</div>
{% endblock %}
