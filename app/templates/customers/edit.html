<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Customer</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow-sm">

        <div class="card-body">

            <div class="d-flex justify-content-between align-items-center mb-4">

                <div>

                    <h2>Edit Customer</h2>

                    <p class="text-muted"> Update customer information </p>

                </div>

                <a href="/customers/{{ customer.id }}" class="btn btn-secondary" > Back </a>

            </div>

            <form method="post">

                <div class="mb-3">

                    <label class="form-label"> Company Name </label>

                    <input type="text" name="company_name" value="{{ customer.company_name }}" class="form-control" required >

                </div>

                <div class="mb-3">

                    <label class="form-label"> Address </label>

                    <textarea name="address" class="form-control" rows="4" >{{ customer.address }}</textarea>

                </div>

                <div class="mb-3">

                    <label class="form-label"> Website </label>

                    <input type="text" name="website" value="{{ customer.website }}" class="form-control" >

                </div>

                <button type="submit" class="btn btn-warning" > Update Customer </button>

            </form>

        </div>

    </div>

</div>

</body>
</html>
