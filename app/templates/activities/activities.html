<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales Activities</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1>Sales Activities</h1>
            <p class="text-muted">Track meetings, calls and follow ups</p>
        </div>
        <div>
            <a href="/activities/new" class="btn btn-primary">Create Activity</a>
            <a href="/" class="btn btn-dark">Home</a>
        </div>
    </div>

    {% for activity in activities %}
    <div class="card mb-3">
        <div class="card-body">
            <div class="d-flex justify-content-between">
                <div>
                    <h4>
                        <a href="/activities/{{ activity.id }}" class="text-decoration-none">
                            {{ activity.title }}
                        </a>
                    </h4>
                    <p><strong>Type:</strong> {{ activity.activity_type }}</p>
                    <p><strong>Status:</strong> {{ activity.status }}</p>
                    <p><strong>Notes:</strong> {{ activity.notes }}</p>
                    <p><strong>Date:</strong> {{ activity.activity_date }}</p>
                </div>
                <div>
                    <form method="POST" action="/activities/{{ activity.id }}/delete" onsubmit="return confirm('Delete this activity?')">
                        <button type="submit" class="btn btn-danger btn-sm">Delete</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
    {% endfor %}
</div>

</body>
</html>
