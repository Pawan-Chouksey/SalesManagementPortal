{% extends 'base.html' %}

{% block title %}Log Activity - Salesline{% endblock %}

{% block content %}
<div class="mb-4 d-flex justify-content-between align-items-center">
    <div>
        <h2 class="fw-bold text-theme-dark"><i class="bi bi-calendar-plus me-2 text-primary"></i>Log Sales Activity</h2>
        <p class="text-muted mb-0">Record a meeting, call, or follow-up.</p>
    </div>
    <div class="d-flex gap-2">
        <a href="/activities" class="btn btn-secondary px-4"><i class="bi bi-arrow-left me-2"></i>Back</a>
    </div>
</div>

<div class="glass-card p-4 p-md-5 form-container">
    <form method="POST">
        <div class="mb-4">
            <label class="form-label fw-bold small text-muted">Customer</label>
            <div class="input-icon-wrapper">
                <i class="bi bi-building"></i>
                <select name="customer_id" class="form-select form-control-icon py-2" required>
                    <option value="" disabled selected>Select a customer...</option>
                    {% for customer in customers %}
                    <option value="{{ customer.id }}">{{ customer.company_name }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <div class="row">
            <div class="col-md-6 mb-4">
                <label class="form-label fw-bold small text-muted">Activity Type</label>
                <div class="input-icon-wrapper">
                    <i class="bi bi-tags"></i>
                    <select name="activity_type" class="form-select form-control-icon py-2" required>
                        <option value="meeting">Meeting</option>
                        <option value="call">Call</option>
                        <option value="email">Email</option>
                        <option value="demo">Demo</option>
                        <option value="follow_up">Follow Up</option>
                    </select>
                </div>
            </div>
            <div class="col-md-6 mb-4">
                <label class="form-label fw-bold small text-muted">Title / Summary</label>
                <div class="input-icon-wrapper">
                    <i class="bi bi-card-heading"></i>
                    <input type="text" name="title" class="form-control form-control-icon py-2" placeholder="e.g. Discovery Call" required>
                </div>
            </div>
        </div>

        <div class="mb-4">
            <label class="form-label fw-bold small text-muted">Notes & Details</label>
            <div class="input-icon-wrapper">
                <i class="bi bi-chat-text input-icon-absolute"></i>
                <textarea name="notes" class="form-control form-control-icon py-2" rows="4" placeholder="What was discussed?"></textarea>
            </div>
        </div>

        <div class="mb-5">
            <label class="form-label fw-bold small text-muted">Follow Up Date</label>
            <div class="input-icon-wrapper">
                <i class="bi bi-calendar-event"></i>
                <input type="datetime-local" name="follow_up_date" class="form-control form-control-icon py-2">
            </div>
        </div>

        <div class="d-flex justify-content-end">
            <button type="submit" class="btn btn-primary px-5 py-2 fw-bold">
                Log Activity <i class="bi bi-check2 ms-2"></i>
            </button>
        </div>
    </form>
</div>
{% endblock %}
