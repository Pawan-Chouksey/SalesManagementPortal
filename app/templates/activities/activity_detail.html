<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activity Detail</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>{{ activity.title }}</h1>
        <div>
            <a href="/activities" class="btn btn-secondary">Back</a>
            <a href="/" class="btn btn-dark">Home</a>
        </div>
    </div>

    <div class="card mb-4">
        <div class="card-body">
            <p><strong>Customer:</strong> {{ activity.customer.company_name }}</p>
            <p><strong>Activity Type:</strong> {{ activity.activity_type }}</p>
            <p><strong>Notes:</strong> {{ activity.notes }}</p>
            <p><strong>Status:</strong> {{ activity.status }}</p>
            <p><strong>Activity Date:</strong> {{ activity.activity_date }}</p>
            <p><strong>Follow Up:</strong> {{ activity.follow_up_date }}</p>
        </div>
    </div>

    <div class="card mb-4">
        <div class="card-body">
            <h4>Update Status</h4>
            <form method="POST" action="/activities/{{ activity.id }}/status">
                <div class="mb-3">
                    <select name="status" class="form-select">
                        <option value="pending">Pending</option>
                        <option value="completed">Completed</option>
                        <option value="cancelled">Cancelled</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary">Update</button>
            </form>
        </div>
    </div>

    <div class="card mb-4">
        <div class="card-body">
            <form method="POST" action="/activities/{{ activity.id }}/delete" onsubmit="return confirm('Delete this activity?')">
                <button type="submit" class="btn btn-danger">Delete Activity</button>
            </form>
        </div>
    </div>
</div>

</body>
</html>
