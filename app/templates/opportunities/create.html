{% extends 'base.html' %}

{% block title %}Create Opportunity - Salesline{% endblock %}

{% block content %}
<div class="mb-4 d-flex justify-content-between align-items-center">
    <div>
        <h2 class="fw-bold text-theme-dark"><i class="bi bi-briefcase me-2 text-primary"></i>Create Opportunity</h2>
        <p class="text-muted mb-0">Add a new sales opportunity to the pipeline.</p>
    </div>
    <div class="d-flex gap-2">
        <a href="/opportunities" class="btn btn-secondary px-4"><i class="bi bi-arrow-left me-2"></i>Back</a>
    </div>
</div>

<div class="glass-card p-4 p-md-5 form-container">
    <form method="post">
        <div class="mb-4">
            <label class="form-label fw-bold small text-muted">Customer</label>
            <div class="input-icon-wrapper">
                <i class="bi bi-building"></i>
                <select name="customer_id" class="form-select form-control-icon py-2" required>
                    <option value="" disabled selected>Select a customer...</option>
                    {% for customer in customers %}
                    <option value="{{ customer.id }}">{{ customer.company_name }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <div class="mb-4">
            <label class="form-label fw-bold small text-muted">Deal Title</label>
            <div class="input-icon-wrapper">
                <i class="bi bi-tag"></i>
                <input type="text" name="title" class="form-control form-control-icon py-2" placeholder="e.g. Enterprise Software License" required>
            </div>
        </div>

        <div class="row">
            <div class="col-md-6 mb-4">
                <label class="form-label fw-bold small text-muted">Deal Value (₹)</label>
                <div class="input-icon-wrapper">
                    <i class="bi bi-currency-rupee"></i>
                    <input type="number" step="0.01" name="deal_value" class="form-control form-control-icon py-2" placeholder="0.00" required>
                </div>
            </div>
            <div class="col-md-6 mb-4">
                <label class="form-label fw-bold small text-muted">Probability (%)</label>
                <div class="input-icon-wrapper">
                    <i class="bi bi-percent"></i>
                    <input type="number" name="probability" class="form-control form-control-icon py-2" min="0" max="100" placeholder="e.g. 25">
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-md-6 mb-4">
                <label class="form-label fw-bold small text-muted">Stage</label>
                <div class="input-icon-wrapper">
                    <i class="bi bi-bar-chart-steps"></i>
                    <select name="stage" class="form-select form-control-icon py-2">
                        <option value="Lead">Lead</option>
                        <option value="Qualified">Qualified</option>
                        <option value="Proposal">Proposal</option>
                        <option value="Negotiation">Negotiation</option>
                    </select>
                </div>
            </div>
            <div class="col-md-6 mb-4">
                <label class="form-label fw-bold small text-muted">Expected Close Date</label>
                <div class="input-icon-wrapper">
                    <i class="bi bi-calendar-event"></i>
                    <input type="date" name="expected_close_date" class="form-control form-control-icon py-2">
                </div>
            </div>
        </div>

        <div class="mb-5">
            <label class="form-label fw-bold small text-muted">Competitor Name (Optional)</label>
            <div class="input-icon-wrapper">
                <i class="bi bi-shield-x"></i>
                <input type="text" name="competitor_name" class="form-control form-control-icon py-2" placeholder="Who are we competing against?">
            </div>
        </div>

        <div class="d-flex justify-content-end">
            <button type="submit" class="btn btn-primary px-5 py-2 fw-bold">
                Create Opportunity <i class="bi bi-check2 ms-2"></i>
            </button>
        </div>
    </form>
</div>
{% endblock %}
