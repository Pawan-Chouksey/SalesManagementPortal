<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Opportunity</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-4" style="max-width: 800px;">
    <div class="card shadow-sm">
        <div class="card-body p-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h1 class="h2 mb-1">Create Opportunity</h1>
                    <p class="text-muted mb-0">Add a new sales opportunity</p>
                </div>
                <div>
                    <a href="/opportunities" class="btn btn-secondary btn-sm">Back</a>
                    <a href="/" class="btn btn-dark btn-sm">Home</a>
                </div>
            </div>


            <form method="post">
                <div class="mb-3">
                    <label class="form-label">Customer</label>
                    <select name="customer_id" class="form-select" required>
                        {% for customer in customers %}
                        <option value="{{ customer.id }}">{{ customer.company_name }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Deal Title</label>
                    <input type="text" name="title" class="form-control" placeholder="e.g. Enterprise Software License" required>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Deal Value</label>
                        <input type="number" step="0.01" name="deal_value" class="form-control" placeholder="0.00" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Probability %</label>
                        <input type="number" name="probability" class="form-control" min="0" max="100" placeholder="e.g. 25">
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Stage</label>
                        <select name="stage" class="form-select">
                            <option value="Lead">Lead</option>
                            <option value="Qualified">Qualified</option>
                            <option value="Proposal">Proposal</option>
                            <option value="Negotiation">Negotiation</option>
                        </select>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Expected Close Date</label>
                        <input type="date" name="expected_close_date" class="form-control">
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label">Competitor Name</label>
                    <input type="text" name="competitor_name" class="form-control" placeholder="Optional">
                </div>

                <button type="submit" class="btn btn-primary w-100">Create Opportunity</button>
            </form>
        </div>
    </div>
</div>

</body>
</html>
